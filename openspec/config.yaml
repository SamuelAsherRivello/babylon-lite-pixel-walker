schema: spec-driven
context: |
  Pixel Walker is a browser falling-sand platform sandbox in pixel-walker/.
  Repository: SamuelAsherRivello/babylon-lite-pixel-walker.
  Use @babylonjs/lite and WebGPU, Vite, and JavaScript modules. Keep npm at root.
  A single 9:16 world never scrolls. Support desktop keys and multitouch controls.
  Material simulation and character collision share one resizable cell grid.
  Original art; no assets copied from Noita or the portrait-layout reference.
  Deploy static output to GitHub Pages. No server, credentials, or analytics.
  Test deterministic physics with node:test and browser behavior with Playwright.
  The supplied template already provides Pages and patch-release workflows.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

